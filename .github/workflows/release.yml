name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,release]'
      - run: python -m pytest --cov
      - run: ruff check . && mypy src
      - run: python -m build && twine check dist/*
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@ed0c53930ec7c2dffb3f1624b391f57b7d0970dc # v1
      - uses: softprops/action-gh-release@6cbd405e6b9a013e02cd4bf5a7f64b8cc8d3a764 # v2
        with:
          files: dist/*
