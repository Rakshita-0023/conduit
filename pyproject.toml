[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conduit-gateway"
version = "0.2.1"
description = "Deterministic, local-first MCP federation gateway"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Conduit contributors"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "starlette>=1.0.1,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<7",
  "mypy>=1.11,<2",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0",
]
docs = ["mkdocs-material>=9.5,<10"]
release = ["build>=1.2,<2", "twine>=6,<7", "pip-audit>=2.7,<3"]

[project.scripts]
conduit = "conduit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conduit = ["conduit.example.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["conduit"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/conduit"]
