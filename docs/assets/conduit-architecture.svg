<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">Conduit architecture</title>
  <desc id="desc">MCP clients connect to Conduit, which normalizes protocols and centrally applies policy, audit, catalog, routing, and health before reaching isolated downstream MCP servers.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker>
    <style>
      .bg { fill: #ffffff; }
      .group { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .conduit { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .client { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .downstream { fill: #f0fdf4; stroke: #65a30d; stroke-width: 1.5; }
      .label { font: 600 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .sub { font: 400 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .heading { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #1e3a8a; }
      .groupheading { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .line { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="920" rx="18"/>

  <rect class="group" x="55" y="34" width="1090" height="126" rx="14"/>
  <text class="groupheading" x="80" y="64">MCP clients</text>
  <g>
    <rect class="client" x="90" y="84" width="220" height="52" rx="9"/><text class="label" x="200" y="116" text-anchor="middle">Codex</text>
    <rect class="client" x="350" y="84" width="220" height="52" rx="9"/><text class="label" x="460" y="116" text-anchor="middle">Claude Code</text>
    <rect class="client" x="610" y="84" width="220" height="52" rx="9"/><text class="label" x="720" y="116" text-anchor="middle">MCP Inspector</text>
    <rect class="client" x="870" y="84" width="220" height="52" rx="9"/><text class="label" x="980" y="116" text-anchor="middle">Other MCP clients</text>
  </g>
  <path class="line" d="M600 160 V198"/>

  <rect class="conduit" x="330" y="200" width="540" height="66" rx="11"/>
  <text class="heading" x="600" y="229" text-anchor="middle">Conduit ingress</text>
  <text class="sub" x="600" y="251" text-anchor="middle">One local MCP endpoint</text>
  <path class="line" d="M600 266 V302"/>
  <rect class="node" x="330" y="304" width="540" height="62" rx="10"/>
  <text class="label" x="600" y="331" text-anchor="middle">Compatibility &amp; protocol normalization</text>
  <text class="sub" x="600" y="352" text-anchor="middle">Native modern MCP and standard HTTP session negotiation</text>
  <path class="line" d="M600 366 V402"/>

  <rect class="conduit" x="95" y="404" width="1010" height="230" rx="15"/>
  <text class="heading" x="125" y="437">Conduit control layer</text>
  <g>
    <rect class="node" x="125" y="462" width="175" height="132" rx="10"/>
    <text class="label" x="212" y="497" text-anchor="middle">Policy</text><text class="sub" x="212" y="522" text-anchor="middle">allow / deny</text><text class="sub" x="212" y="543" text-anchor="middle">default-deny</text>
    <rect class="node" x="325" y="462" width="175" height="132" rx="10"/>
    <text class="label" x="412" y="497" text-anchor="middle">Audit</text><text class="sub" x="412" y="522" text-anchor="middle">durable authorization</text><text class="sub" x="412" y="543" text-anchor="middle">before dispatch</text>
    <rect class="node" x="525" y="462" width="175" height="132" rx="10"/>
    <text class="label" x="612" y="497" text-anchor="middle">Catalog</text><text class="sub" x="612" y="522" text-anchor="middle">namespaced tools</text><text class="sub" x="612" y="543" text-anchor="middle">immutable routes</text>
    <rect class="node" x="725" y="462" width="175" height="132" rx="10"/>
    <text class="label" x="812" y="497" text-anchor="middle">Routing</text><text class="sub" x="812" y="522" text-anchor="middle">exact downstream</text><text class="sub" x="812" y="543" text-anchor="middle">tool identity</text>
    <rect class="node" x="925" y="462" width="150" height="132" rx="10"/>
    <text class="label" x="1000" y="497" text-anchor="middle">Health</text><text class="sub" x="1000" y="522" text-anchor="middle">degraded</text><text class="sub" x="1000" y="543" text-anchor="middle">recovery</text>
  </g>
  <path class="line" d="M600 634 V670"/>
  <rect class="node" x="330" y="672" width="540" height="64" rx="10"/>
  <text class="label" x="600" y="699" text-anchor="middle">Downstream transport compatibility</text>
  <text class="sub" x="600" y="721" text-anchor="middle">Bounded JSON or finite terminal SSE responses</text>
  <path class="line" d="M600 736 V770"/>

  <rect class="group" x="55" y="772" width="1090" height="120" rx="14"/>
  <text class="groupheading" x="80" y="802">Downstream MCP servers</text>
  <g>
    <rect class="downstream" x="90" y="822" width="220" height="46" rx="9"/><text class="label" x="200" y="851" text-anchor="middle">GitHub MCP</text>
    <rect class="downstream" x="350" y="822" width="220" height="46" rx="9"/><text class="label" x="460" y="851" text-anchor="middle">Slack MCP</text>
    <rect class="downstream" x="610" y="822" width="220" height="46" rx="9"/><text class="label" x="720" y="851" text-anchor="middle">Database MCP</text>
    <rect class="downstream" x="870" y="822" width="220" height="46" rx="9"/><text class="label" x="980" y="851" text-anchor="middle">Custom MCP</text>
  </g>
  <path class="dashed" d="M1110 630 C1170 640,1170 708,875 704"/>
  <text class="sub" x="1122" y="658">Per-server credentials</text><text class="sub" x="1122" y="677">stay isolated</text>
</svg>
